name: http_api_ninja
description: "HTTP API Ninja - A powerful cross-platform HTTP client application inspired by Thunder Client. Test, debug, and document REST APIs with an intuitive UI. Features include request building, response visualization, environment management, request history, pre-run scripts, and code snippet generation. Built with Flutter for Windows."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev


version: 1.1.4

environment:
  sdk: ^3.11.5

# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.9
  get_x_master: ^0.0.30
  get_x_storage: ^0.1.0
  flutter_code_view: ^0.0.5
  url_launcher: ^6.3.2
  path_provider_master: ^1.0.0
  platform_version: ^0.0.4
  toastification:
    git:
      url: https://github.com/SwanFlutter/toastification.git

dev_dependencies:
  flutter_test:
    sdk: flutter


  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

# App Icons Configuration
flutter_launcher_icons:
  windows:
    generate: true
    image_path: "assets/new_logo.png"
    icon_size: 256


flutter:

  uses-material-design: true

 
  assets:
    - assets/
